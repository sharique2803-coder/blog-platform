<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlogSpace – Dashboard</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo"><i class="fas fa-pen-nib"></i> BlogSpace</a>
      <div class="nav-links" id="navLinks">
        <a href="../index.html">Home</a>
        <span id="userLinks" style="display:none;">
          <a href="create-post.html"><i class="fas fa-plus"></i> New Post</a>
          <a href="dashboard.html" class="active"><i class="fas fa-user"></i> <span id="navUsername"></span></a>
          <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </span>
      </div>
      <button class="nav-toggle" id="navToggle"><i class="fas fa-bars"></i></button>
    </div>
  </nav>

  <main class="container dashboard-page">
    <!-- Profile Card -->
    <div class="profile-card">
      <div class="profile-avatar" id="profileAvatar"></div>
      <div class="profile-info">
        <h2 id="profileUsername"></h2>
        <p id="profileEmail" class="profile-email"></p>
        <p id="profileBio" class="profile-bio"></p>
        <button id="editProfileBtn" class="btn-outline-sm"><i class="fas fa-edit"></i> Edit Profile</button>
      </div>
      <div class="profile-stats">
        <div class="stat"><span id="statPosts">0</span><label>Posts</label></div>
        <div class="stat"><span id="statViews">0</span><label>Total Views</label></div>
        <div class="stat"><span id="statLikes">0</span><label>Total Likes</label></div>
      </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="editProfileModal" class="modal-overlay" style="display:none;">
      <div class="modal">
        <h3><i class="fas fa-user-edit"></i> Edit Profile</h3>
        <div id="profileAlertBox" class="alert" style="display:none;"></div>
        <form id="editProfileForm">
          <div class="form-group">
            <label for="editUsername">Username</label>
            <input type="text" id="editUsername" minlength="3" maxlength="30" />
          </div>
          <div class="form-group">
            <label for="editBio">Bio</label>
            <textarea id="editBio" rows="3" maxlength="200" placeholder="Tell us about yourself..."></textarea>
          </div>
          <div class="modal-actions">
            <button type="submit" class="btn-primary">Save Changes</button>
            <button type="button" id="cancelEdit" class="btn-outline">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <!-- My Posts Section -->
    <div class="dashboard-posts">
      <div class="dashboard-posts-header">
        <h3><i class="fas fa-newspaper"></i> My Posts</h3>
        <a href="create-post.html" class="btn-primary-sm"><i class="fas fa-plus"></i> New Post</a>
      </div>
      <div id="myPostsList" class="my-posts-list">
        <div class="loading-spinner"><i class="fas fa-circle-notch fa-spin"></i> Loading your posts...</div>
      </div>
    </div>
  </main>

  <!-- Delete confirm modal -->
  <div id="deleteModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h3><i class="fas fa-exclamation-triangle"></i> Delete Post?</h3>
      <p>This action cannot be undone.</p>
      <div class="modal-actions">
        <button id="confirmDelete" class="btn-danger">Yes, Delete</button>
        <button id="cancelDelete" class="btn-outline">Cancel</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 BlogSpace. Built with <i class="fas fa-heart"></i> for sharing ideas.</p>
  </footer>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
