<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlogSpace – Register</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="auth-body">
  <nav class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo"><i class="fas fa-pen-nib"></i> BlogSpace</a>
    </div>
  </nav>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon"><i class="fas fa-user-plus"></i></div>
        <h1>Create account</h1>
        <p>Join BlogSpace and start sharing your ideas</p>
      </div>

      <div id="alertBox" class="alert" style="display:none;"></div>

      <form id="registerForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="username"><i class="fas fa-user"></i> Username</label>
          <input type="text" id="username" name="username" placeholder="coolwriter42" required minlength="3" />
          <span class="field-error" id="usernameError"></span>
        </div>
        <div class="form-group">
          <label for="email"><i class="fas fa-envelope"></i> Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
          <span class="field-error" id="emailError"></span>
        </div>
        <div class="form-group">
          <label for="password"><i class="fas fa-lock"></i> Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" placeholder="Min. 6 characters" required minlength="6" />
            <button type="button" class="toggle-pw" id="togglePw"><i class="fas fa-eye"></i></button>
          </div>
          <div class="password-strength" id="strengthBar"><div class="strength-fill" id="strengthFill"></div></div>
          <span class="field-error" id="passwordError"></span>
        </div>
        <div class="form-group">
          <label for="confirmPassword"><i class="fas fa-lock"></i> Confirm Password</label>
          <div class="password-wrap">
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat password" required />
            <button type="button" class="toggle-pw" id="togglePw2"><i class="fas fa-eye"></i></button>
          </div>
          <span class="field-error" id="confirmError"></span>
        </div>
        <button type="submit" class="btn-primary btn-full" id="registerBtn">
          <span>Create Account</span><i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/register.js"></script>
</body>
</html>
