<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlogSpace – Login</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="auth-body">
  <nav class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo"><i class="fas fa-pen-nib"></i> BlogSpace</a>
    </div>
  </nav>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon"><i class="fas fa-sign-in-alt"></i></div>
        <h1>Welcome back</h1>
        <p>Log in to your BlogSpace account</p>
      </div>

      <div id="alertBox" class="alert" style="display:none;"></div>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email"><i class="fas fa-envelope"></i> Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
          <span class="field-error" id="emailError"></span>
        </div>
        <div class="form-group">
          <label for="password"><i class="fas fa-lock"></i> Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="toggle-pw" id="togglePw"><i class="fas fa-eye"></i></button>
          </div>
          <span class="field-error" id="passwordError"></span>
        </div>
        <button type="submit" class="btn-primary btn-full" id="loginBtn">
          <span>Login</span><i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <p class="auth-footer">Don't have an account? <a href="register.html">Sign up</a></p>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
